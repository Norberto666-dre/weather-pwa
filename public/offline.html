<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — WeatherPWA</title>
    <meta name="theme-color" content="#07131c" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #07131c;
        --panel: #0e2734;
        --line: rgba(216, 169, 74, 0.22);
        --gold: #d8a94a;
        --parchment: #f4ecdd;
        --muted: #9db0bd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(90% 60% at 50% 0%, rgba(216, 169, 74, 0.14), transparent 65%),
          linear-gradient(180deg, #07131c, #0b2230 60%, #12303f);
        color: var(--parchment);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: min(28rem, 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(165deg, rgba(18, 48, 63, 0.9), rgba(11, 34, 48, 0.95));
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 40px 90px -50px rgba(0, 0, 0, 0.9);
      }
      .seal {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 1px solid rgba(216, 169, 74, 0.5);
        display: grid;
        place-items: center;
        color: var(--gold);
        font-family: ui-serif, Palatino, Georgia, serif;
        font-size: 28px;
      }
      .label {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
      }
      h1 {
        margin: 10px 0 8px;
        font-family: ui-serif, Palatino, Georgia, serif;
        font-weight: 600;
        font-size: 30px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        border-radius: 8px;
        background: var(--gold);
        color: #07131c;
        padding: 11px 18px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="seal" aria-hidden="true">☾</div>
      <p class="label">WeatherPWA</p>
      <h1>El cielo está en pausa</h1>
      <p>
        No hay conexión y este lugar todavía no tiene datos guardados. Vuelve a
        intentarlo cuando recuperes internet.
      </p>
      <a href="/">Volver a intentar</a>
    </main>
  </body>
</html>
